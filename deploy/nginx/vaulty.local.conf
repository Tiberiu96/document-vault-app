# Numai dezvoltare locala pe acest calculator.
server {
    listen 127.0.0.1:80;
    server_name vaulty.test;
    root /var/www/document-vault-app/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/vaulty.test.access.log;
    error_log /var/log/nginx/vaulty.test.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm-vaulty.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
