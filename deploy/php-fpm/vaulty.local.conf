; Pool local dedicat: pastreaza .env 0600 si accesul la storage fara chmod 777.
; In productie se va folosi un utilizator de sistem dedicat aplicatiei.
[vaulty]
user = tiberiu
group = tiberiu
listen = /run/php/php8.3-fpm-vaulty.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

chdir = /var/www/document-vault-app
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/document-vault-app/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 6M
