name: Vaulty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Teste Laravel si build CSS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      AI_ENABLED: "false"
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      BACKUP_ENABLED: "false"
      TURNSTILE_ENABLED: "false"

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configureaza PHP 8.3
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, gd, zip, pdo_mysql, pdo_sqlite, redis, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Instaleaza utilitarele PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils ghostscript

      - name: Pregateste mediul izolat
        run: cp .env.example .env

      - name: Valideaza Composer
        run: composer validate --strict --no-check-publish

      - name: Instaleaza dependintele
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Verifica stilul PHP
        run: vendor/bin/pint --test

      - name: Instaleaza Tailwind standalone
        run: |
          mkdir -p .tools
          curl --fail --silent --show-error --location \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 \
            --output .tools/tailwindcss
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  .tools/tailwindcss" \
            | sha256sum --check
          chmod +x .tools/tailwindcss

      - name: Construieste CSS
        run: composer css:build

      - name: Ruleaza testele
        run: php artisan test --compact

      - name: Verifica instalarea fara dependinte de dezvoltare
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev

      - name: Verifica cache-ul pentru productie
        run: |
          APP_ENV=production php artisan config:cache
          APP_ENV=production php artisan route:cache
          APP_ENV=production php artisan view:cache

      - name: Pastreaza CSS-ul verificat
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: css-${{ github.sha }}
          path: public/css/app.css
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy productie
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: vaulty-production-deploy
      cancel-in-progress: false
    steps:
      - name: Descarca CSS-ul aceluiasi commit
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: css-${{ github.sha }}
          path: compiled-css

      - name: Livreaza prin conexiunea SSH restrictionata
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/vaulty-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$COMMIT_SHA"
            sha256sum compiled-css/app.css | cut -d ' ' -f 1
            base64 -w 0 compiled-css/app.css
            printf '\n'
          } | ssh -T -i "$HOME/.ssh/vaulty-deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
